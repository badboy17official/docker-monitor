# Prometheus configuration for DevSecOps Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devsecops-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway metrics
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'

  # Auth Service metrics
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']
    metrics_path: '/metrics'

  # Scan Orchestrator metrics
  - job_name: 'scan-orchestrator'
    static_configs:
      - targets: ['scan-orchestrator:8002']
    metrics_path: '/metrics'

  # AI Engine metrics
  - job_name: 'ai-engine'
    static_configs:
      - targets: ['ai-engine:8003']
    metrics_path: '/metrics'

  # Report Service metrics
  - job_name: 'report-service'
    static_configs:
      - targets: ['report-service:8004']
    metrics_path: '/metrics'

  # Dashboard Backend metrics
  - job_name: 'dashboard-backend'
    static_configs:
      - targets: ['dashboard-backend:8005']
    metrics_path: '/metrics'

  # Runtime Monitor metrics
  - job_name: 'runtime-monitor'
    static_configs:
      - targets: ['runtime-monitor:8006']
    metrics_path: '/metrics'
