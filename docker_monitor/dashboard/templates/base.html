<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Docker Monitor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'attribute',
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#1e293b', 2: '#0f172a' },
            accent: '#38bdf8',
            good: '#4ade80',
            warn: '#fbbf24',
            bad: '#f87171',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(71, 85, 105, 0.4); }
    .glow { box-shadow: 0 0 24px rgba(56, 189, 248, 0.1); }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
