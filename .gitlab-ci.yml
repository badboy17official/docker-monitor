stages:
  - test
  - build
  - scan
  - report
  - deploy

variables:
  DOCKER_DRIVER: overlay2

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt pytest
    - PYTHONPATH=. pytest tests/ -v
  only:
    - merge_requests
    - main
    - develop

build:vulnerable:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f Dockerfile.vuln -t $CI_REGISTRY_IMAGE/vulnerable:$CI_COMMIT_SHA .
    - docker build -f Dockerfile.vuln -t $CI_REGISTRY_IMAGE/vulnerable:latest .
  tags:
    - docker

build:hardened:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f Dockerfile.hardened -t $CI_REGISTRY_IMAGE/hardened:$CI_COMMIT_SHA .
    - docker build -f Dockerfile.hardened -t $CI_REGISTRY_IMAGE/hardened:latest .
  tags:
    - docker

scan:trivy:vulnerable:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 0 --format json --output trivy-vulnerable.json $CI_REGISTRY_IMAGE/vulnerable:$CI_COMMIT_SHA
    - trivy image --severity CRITICAL,HIGH --exit-code 0 $CI_REGISTRY_IMAGE/vulnerable:$CI_COMMIT_SHA
  artifacts:
    paths:
      - trivy-vulnerable.json
    expire_in: 30 days
  dependencies:
    - build:vulnerable
  allow_failure: true

scan:trivy:hardened:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 0 --format json --output trivy-hardened.json $CI_REGISTRY_IMAGE/hardened:$CI_COMMIT_SHA
    - trivy image --severity CRITICAL --exit-code 1 $CI_REGISTRY_IMAGE/hardened:$CI_COMMIT_SHA
  artifacts:
    paths:
      - trivy-hardened.json
    expire_in: 30 days
  dependencies:
    - build:hardened

report:generate:
  stage: report
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python -m docker_monitor.cli audit
    - python -m docker_monitor.cli report --format html
  artifacts:
    paths:
      - reports/
    expire_in: 90 days
  dependencies:
    - scan:trivy:vulnerable
    - scan:trivy:hardened

deploy:staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying hardened image to staging..."
    - echo "Image: $CI_REGISTRY_IMAGE/hardened:$CI_COMMIT_SHA"
  only:
    - develop
  when: manual
  environment:
    name: staging

deploy:production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying hardened image to production..."
    - echo "Image: $CI_REGISTRY_IMAGE/hardened:$CI_COMMIT_SHA"
  only:
    - main
  when: manual
  environment:
    name: production
  dependencies:
    - report:generate
