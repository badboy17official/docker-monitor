version: '3.8'

services:
  # Vulnerable Flask Application
  flask-vulnerable:
    build:
      context: .
      dockerfile: Dockerfile.vuln
    image: flask-app-vulnerable:latest
    container_name: flask-vulnerable
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - API_KEY=super-secret-key  # ❌ Hardcoded secret
    # ❌ Running as root (default)
    # ❌ No resource limits
    # ❌ No health checks
    networks:
      - app-network

  # Hardened Flask Application
  flask-hardened:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    image: flask-app-hardened:latest
    container_name: flask-hardened
    ports:
      - "5002:5000"
    environment:
      - FLASK_ENV=production
    # ✅ Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # ✅ Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # ✅ Read-only filesystem (except tmp)
    read_only: true
    tmpfs:
      - /tmp
    # ✅ Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - app-network

  # Security Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: security-dashboard:latest
    container_name: security-dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./reports:/app/reports:ro
    environment:
      - FLASK_ENV=production
    depends_on:
      - flask-vulnerable
      - flask-hardened
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
