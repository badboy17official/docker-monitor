services:
  flask-vulnerable:
    build:
      context: .
      dockerfile: Dockerfile.vuln
    image: flask-app-vulnerable:latest
    container_name: flask-vulnerable
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - API_KEY=super-secret-key
    networks:
      - app-network

  flask-hardened:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    image: flask-app-hardened:latest
    container_name: flask-hardened
    ports:
      - "5002:5000"
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: security-dashboard:latest
    container_name: security-dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./reports:/app/reports
      - ./runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - FLASK_ENV=production
      - DASHBOARD_AUTH_USER=${DASHBOARD_AUTH_USER}
      - DASHBOARD_AUTH_PASSWORD=${DASHBOARD_AUTH_PASSWORD}
    depends_on:
      - flask-vulnerable
      - flask-hardened
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
