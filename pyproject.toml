[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-monitor"
version = "2.8.0"
description = "Container Security Audit & Runtime Threat Monitoring Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "noble6 (DeAd_SeC)"},
]
keywords = ["docker", "security", "container", "audit", "vulnerability", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1.2",
    "requests>=2.31.0",
    "docker>=7.0.0",
    "rich>=13.0.0",
    "Flask>=3.0.0",
    "Flask-Limiter>=3.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
docker-monitor = "docker_monitor.cli:cli"

[project.urls]
Homepage = "https://github.com/noble6/docker-monitor"
Repository = "https://github.com/noble6/docker-monitor"

[tool.setuptools.packages.find]
include = ["docker_monitor*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
