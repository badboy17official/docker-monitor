[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-monitor"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1.2",
    "requests>=2.31.0",
    "docker>=7.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]
