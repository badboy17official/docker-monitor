name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint
        run: pip install ruff && ruff check docker_monitor/

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build vulnerable image
        run: docker build -f Dockerfile.vuln -t vulnerable-image:latest .

      - name: Build hardened image
        run: docker build -f Dockerfile.hardened -t hardened-image:latest .

      - name: Run Trivy on vulnerable image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'vulnerable-image:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Run Trivy on hardened image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'hardened-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
