name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: PYTHONPATH=. pytest tests/

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build vulnerable image
        run: docker build -f Dockerfile.vuln -t vulnerable-image:latest .

      - name: Build hardened image
        run: docker build -f Dockerfile.hardened -t hardened-image:latest .

      - name: Run Trivy vulnerability scanner on vulnerable image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-image:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Run Trivy vulnerability scanner on hardened image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hardened-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
