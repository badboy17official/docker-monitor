# Docker Monitor v2.8 Configuration
# Every key below is read and used by the application.

project:
  name: "docker-monitor"
  version: "2.8.0"

images:
  vulnerable:
    name: "flask-app-vulnerable"
    dockerfile: "Dockerfile.vuln"
    context: "."
  hardened:
    name: "flask-app-hardened"
    dockerfile: "Dockerfile.hardened"
    context: "."

scanning:
  parallel: true
  max_workers: 4
  trivy:
    enabled: true
    severity: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
    timeout: 300
    ignore_unfixed: false
  dockle:
    enabled: true
    timeout: 120
  syft:
    enabled: true
    format: "json"
  grype:
    enabled: true
    format: "json"

thresholds:
  critical: 5
  high: 20
  medium: 50
  low: 100
  image_size_mb: 500
  fail_on_exceed: true

reporting:
  formats: ["json", "html"]
  output_dir: "reports"
  max_history: 30

alerting:
  enabled: false
  threshold: 75
  webhook_url: ""

runtime:
  enabled: true
  poll_interval_seconds: 20
  ai_window_size: 12
  max_concurrent_scans: 3
  hosts:
    - "unix://var/run/docker.sock"

vulnerability:
  enabled: true
  scan_cache_ttl_seconds: 900

cloud:
  enabled: true
  source: "osv"
  sync_interval_hours: 6
  max_concurrent_fetches: 5

ml:
  enabled: false
  model_url: ""
  model_sha256: ""

dashboard:
  host: "0.0.0.0"
  port: 8080
  rate_limit: "200 per day"
